name: grab-roadtest

on:
  schedule:
    - cron: "7,37 * * * *"   # backup only: GitHub often skips scheduled runs
  workflow_dispatch:
    inputs:
      args:
        description: "one-off run instead of hunting, e.g. --list  or  --trial --yes"
        default: ""

concurrency:
  # one-off runs (--list, --trial) get their own group so they don't queue behind a 6 h hunt
  group: grab-roadtest-${{ github.event.inputs.args && 'oneoff' || 'hunt' }}
  cancel-in-progress: false

permissions:
  actions: write   # lets the job start the next run, or disable itself when done

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      ICBC_LAST_NAME: ${{ secrets.ICBC_LAST_NAME }}
      ICBC_LICENCE: ${{ secrets.ICBC_LICENCE }}
      ICBC_KEYWORD: ${{ secrets.ICBC_KEYWORD }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Check secrets
        id: ready
        run: |
          if [ -z "$ICBC_LICENCE" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "::warning::ICBC_* / GMAIL_* secrets are not set yet; not hunting"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Hunt
        id: grab
        if: steps.ready.outputs.ok == 'true'
        run: |
          set +e
          if [ -n "${{ github.event.inputs.args }}" ]; then
            python icbc_roadtest.py ${{ github.event.inputs.args }}
            exit $?
          fi
          python icbc_roadtest.py --run-minutes 345
          code=$?
          if [ $code -eq 10 ]; then echo "done=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - name: Disable schedule when done
        if: steps.grab.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable grab-roadtest --repo "$GITHUB_REPOSITORY"
      - name: Start the next run
        # each run hands off to the next so polling never depends on cron;
        # skipped for manual one-off runs (--list, --trial ...)
        # never chain without secrets, and back off after a failure so a persistent error can't spin
        if: always() && steps.ready.outputs.ok == 'true' && steps.grab.outputs.done != 'true' && !github.event.inputs.args
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.grab.outcome }}" = "failure" ]; then sleep 300; fi
          gh workflow run grab.yml --repo "$GITHUB_REPOSITORY" --ref main
