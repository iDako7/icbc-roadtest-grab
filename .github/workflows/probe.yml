name: probe-icbc
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Script login code with fake credentials
        run: |
          python - <<'PY'
          import icbc_roadtest as m
          m.save = lambda *a: None
          try:
              m.Icbc("TESTER", "1000000", "0000").login()
          except Exception as e:
              print("script login(fake creds):", e)
          PY
